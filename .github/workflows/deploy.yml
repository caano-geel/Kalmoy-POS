# Deploy Kalmoy POS to InfinityFree custom-domain document root.
#
# Incremental sync:
# SamKirkland/FTP-Deploy-Action compares local file hashes with
# .ftp-deploy-sync-state.json stored inside kalmoypos.com/htdocs/.
# Do not exclude or manually delete the sync-state file.
#
# Production-only and runtime files are protected from GitHub deployment:
# config.production.php, initialize.production.php, .env, uploads/,
# backups/, cache/, logs/.
#
# Local-only and diagnostic files must never reach production:
# config.local.php, initialize.local.php, db-check.php.

name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-kalmoypos-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21

          # Local GitHub repository root
          local-dir: ./

          # Custom-domain document root shown in InfinityFree File Manager:
          # Home/kalmoypos.com/htdocs/
          server-dir: ./kalmoypos.com/htdocs/

          # Required for fast incremental deployments
          state-name: .ftp-deploy-sync-state.json

          # Never wipe the production directory
          dangerous-clean-slate: false

          timeout: 120000
          log-level: standard

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**

            **/.env
            **/.env.*
            **/config.local.php
            **/initialize.local.php
            **/config.production.php
            **/initialize.production.php
            **/db-check.php

            **/DATABASE FILE/**
            **/database/**
            **/backups/**
            **/backup_production_config/**
            **/uploads/**
            **/cache/**
            **/tmp/**
            **/temp/**
            **/logs/**

            **/*.sql
            **/*.log
            **/*.zip
            **/*.rar
            **/*.example

            **/.gitignore
            **/OFFLINE_SETUP.md
            **/LOCAL_SETUP.md
            **/DEPLOY_INFINITYFREE.md
            **/README.md

            **/tools/**
            **/build/**

            **/composer.json
            **/composer.lock